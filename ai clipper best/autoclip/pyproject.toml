[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip"
version = "0.1.0"
description = "YouTube link -> branded vertical shorts: hooks, Hindi captions, watermark, copyright-safe transforms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2025.1.15",
  "Pillow>=10.3",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0"]
llm = ["openai>=1.60.0"]

[project.scripts]
autoclip = "autoclip.cli:main"

[tool.setuptools]
packages = ["autoclip"]

[tool.setuptools.package-data]
autoclip = []
