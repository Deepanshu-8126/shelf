name: YouTube Shorts - Channel 3 (Psychological Loops & Dark Mind Games)

on:
  schedule:
    # 01:00 UTC (6:30 AM IST) and 13:00 UTC (6:30 PM IST)
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_and_upload_ch3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factshorts-bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup YouTube Credentials (Channel 3)
        env:
          YT_TOKEN_CH3_B64: ${{ secrets.YT_TOKEN_CH3_B64 || secrets.YT_TOKEN_B64 }}
          YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
        run: |
          mkdir -p credentials
          [ -n "$YT_TOKEN_CH3_B64" ] && printf '%s' "$YT_TOKEN_CH3_B64" | base64 -d > credentials/token.json || true
          [ -n "$YT_CLIENT_B64" ]    && printf '%s' "$YT_CLIENT_B64"    | base64 -d > credentials/client_secret.json || true
          python3 -c "import json; json.load(open('credentials/token.json')); print('✅ token.json is valid JSON for Channel 3')" 2>/dev/null || echo "❌ token.json is NOT valid JSON"

      - name: Generate and Upload Short (Psychology & Mind Game Loops)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FOOTAGE_PROVIDERS: pexels,pixabay,nasa,wikimedia,local
          
          # Configuration for Channel 3 (High Retention Psychological Loops)
          LLM_PROVIDER: gemini
          NICHE: psychology
          VIDEO_MODE: story
          SCRIPT_STYLE: punchy
          SCRIPT_LANGUAGE: english
          VOICE_PROVIDER: edge
          VOICE: en-US-ChristopherNeural
          
        run: |
          python main.py --generate psychology --mode story --upload 1 --privacy unlisted

      - name: Keep topic memory
        if: always()
        run: |
          git config user.name  "factshorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/factshorts.db 2>/dev/null || true
          git commit -m "chore: topic memory update $(date -u +%F-%H%M)" || echo "nothing to commit"
          git push || echo "push skipped"
