name: 🏛️ LM Arena 4K AI Photoshoot Engine

on:
  workflow_dispatch:
    inputs:
      batch_count:
        description: 'Number of Pinterest Photoshoots to generate'
        required: true
        default: '3'
      custom_title:
        description: 'Custom Dress/Saree Title (Leave empty for automated catalog)'
        required: false
        default: ''
      custom_pose:
        description: 'Pose Style (e.g. GRAND_STAIRCASE_ELEGANCE, HAIR_UPDO_BACK_DETAIL, HOTEL_CORRIDOR_STRUT)'
        required: false
        default: 'GRAND_STAIRCASE_ELEGANCE'

jobs:
  run-lmarena-photoshoot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow requests python-dotenv urllib3
          playwright install --with-deps chromium

      - name: 🚀 Run LM Arena Photoshoot Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.custom_title }}" ]; then
            python lmarena_photoshoot_engine/lmarena_crawler.py \
              --title "${{ github.event.inputs.custom_title }}" \
              --pose "${{ github.event.inputs.custom_pose }}"
          else
            python lmarena_photoshoot_engine/run_lmarena_batch.py \
              --max "${{ github.event.inputs.batch_count }}"
          fi

      - name: 📤 Upload Rendered Photos Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lmarena-photoshoot-renders
          path: lmarena_photoshoot_engine/rendered_arena_photos/
          retention-days: 14
