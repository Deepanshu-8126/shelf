name: Channel 2 - YouTube Agent Studio (Unsolved History & Mysteries)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Mystery / History Topic (Leave empty for Auto-Discovery)'
        required: false
        default: ''
      script:
        description: 'Custom Script to use instead of generating one (Optional)'
        required: false
        default: ''
      duration:
        description: 'Video Target Duration'
        required: true
        type: choice
        default: 'dynamic'
        options:
          - 'dynamic'
          - '30s'
          - '40s'
          - '50s'
      auto_upload:
        description: 'Upload to YouTube automatically?'
        required: true
        type: boolean
        default: true
      privacy:
        description: 'Video Privacy'
        required: true
        type: choice
        default: 'unlisted'
        options:
          - 'unlisted'
          - 'public'
          - 'private'

permissions:
  contents: write

jobs:
  generate_and_upload_ch2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r super_youtube_agent/01_facts_shorts/requirements.txt
          pip install httpx edge-tts

      - name: Setup YouTube Credentials (Channel 2)
        env:
          YT_TOKEN_CH2_B64: ${{ secrets.YT_TOKEN_CH2_B64 || secrets.YT_TOKEN_B64 }}
          YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
        run: |
          mkdir -p super_youtube_agent/01_facts_shorts/credentials
          [ -n "$YT_TOKEN_CH2_B64" ] && printf '%s' "$YT_TOKEN_CH2_B64" | base64 -d > super_youtube_agent/01_facts_shorts/credentials/token.json || true
          [ -n "$YT_CLIENT_B64" ]    && printf '%s' "$YT_CLIENT_B64"    | base64 -d > super_youtube_agent/01_facts_shorts/credentials/client_secret.json || true
          python3 -c "import json; json.load(open('super_youtube_agent/01_facts_shorts/credentials/token.json')); print('✅ token.json is valid JSON for Channel 2')" 2>/dev/null || echo "ℹ️ token.json pending"

      - name: Generate Short Video (Unsolved History & Mysteries Mode)
        working-directory: super_youtube_agent/01_facts_shorts
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FOOTAGE_PROVIDERS: pexels,pixabay,nasa,wikimedia,local
          LLM_PROVIDER: auto
          NICHE: history
          VIDEO_MODE: story
          SCRIPT_STYLE: documentary
          SCRIPT_LANGUAGE: english
          VOICE_PROVIDER: edge
          VOICE: en-US-AriaNeural
          TOPIC_INPUT: ${{ github.event.inputs.topic }}
          SCRIPT_INPUT: ${{ github.event.inputs.script }}
          DURATION_INPUT: ${{ github.event.inputs.duration }}
          AUTO_UPLOAD: ${{ github.event.inputs.auto_upload }}
          PRIVACY_OPT: ${{ github.event.inputs.privacy || 'unlisted' }}
        run: |
          python main.py --generate --niche history --mode story

      - name: 📱 Send Video Directly to Telegram Phone
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8809830963:AAG22CFChal-D13uSkNLUmCoyHD3FGvgWjY' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6486771356' }}
          CHANNEL_BADGE: 'Channel 2 (Story & Mysteries Studio)'
        run: |
          python send_to_telegram.py super_youtube_agent/01_facts_shorts/output || true

      - name: Save Rendered Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-2-rendered-videos
          path: super_youtube_agent/01_facts_shorts/output/*.mp4
          retention-days: 14

      - name: Keep topic memory (Never repeat topics or clips)
        if: always()
        run: |
          git config user.name  "factshorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f super_youtube_agent/01_facts_shorts/data/factshorts.db 2>/dev/null || true
          git commit -m "chore: topic memory update $(date -u +%F-%H%M)" || echo "nothing to commit"
          git push || echo "push skipped"
