name: YouTube Shorts Automation

on:
  schedule:
    # Runs twice a day: 8:00 AM IST and 7:30 PM IST
    - cron: '30 2 * * *'  # 02:30 UTC = 8:00 AM IST
    - cron: '0 14 * * *'  # 14:00 UTC = 7:30 PM IST
  workflow_dispatch: # Allows you to run it manually with a button click

permissions:
  contents: write

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factshorts-bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup YouTube Credentials
        env:
          YT_TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
          YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
        run: |
          mkdir -p credentials
          # Decode base64-encoded JSON safely (no shell quoting issues)
          [ -n "$YT_TOKEN_B64" ]  && printf '%s' "$YT_TOKEN_B64"  | base64 -d > credentials/token.json || true
          [ -n "$YT_CLIENT_B64" ] && printf '%s' "$YT_CLIENT_B64" | base64 -d > credentials/client_secret.json || true
          # Verify token is valid JSON
          python3 -c "import json; json.load(open('credentials/token.json')); print('✅ token.json is valid JSON')" 2>/dev/null || echo "❌ token.json is NOT valid JSON"

      - name: Generate and Upload Short (Story Mode)
        env:
          # API Keys from Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FOOTAGE_PROVIDERS: pexels,pixabay,nasa,wikimedia,local
          
          # Configuration for US Channel (Pexels Fallback)
          LLM_PROVIDER: gemini
          VIDEO_MODE: story
          SCRIPT_LANGUAGE: english
          SCRIPT_STYLE: friendly
          VOICE_PROVIDER: edge
          VOICE: en-US-ChristopherNeural
          
        run: |
          python main.py --generate --mode story --upload 1 --privacy unlisted

      - name: Keep topic memory (Never repeat topics or clips)
        if: always()
        run: |
          git config user.name  "factshorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/factshorts.db 2>/dev/null || true
          git commit -m "chore: topic memory update $(date -u +%F-%H%M)" || echo "nothing to commit"
          git push || echo "push skipped"
