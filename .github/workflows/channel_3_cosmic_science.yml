name: Channel 3 - Cosmic Science (Hindi)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Topic (Optional - Leave blank for Auto)'
        required: false
        default: ''
        type: string
      pillar:
        description: 'Cosmic Pillar (auto for dynamic rotation across all 5 pillars)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto' # Dynamic Rotation across all 5 pillars
          - '1' # Deep Earth & Ocean Anomalies
          - '2' # Bizarre Human Body Science
          - '3' # Real Everyday What-Ifs
          - '4' # Mysterious Historic & Dark Science Curiosities
          - '5' # Mind-Bending Deep Space Curiosities
      auto_upload:
        description: 'Auto-Upload to YouTube? (Unlisted default)'
        required: true
        default: false
        type: boolean
      privacy:
        description: 'Video Privacy'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - 'unlisted'
          - 'public'
          - 'private'

  schedule:
    # Daily at 15:00 UTC (8:30 PM IST)
    - cron: '0 15 * * *'

permissions:
  contents: write

jobs:
  render_channel_3:
    name: Render Channel 3 Video
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_TOKEN_CH3_B64: ${{ secrets.YT_TOKEN_CH3_B64 || secrets.YT_TOKEN_B64 }}
      YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8809830963:AAG22CFChal-D13uSkNLUmCoyHD3FGvgWjY' }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6486771356' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev libsm6 libxext6 fonts-liberation fonts-noto-core fonts-dejavu espeak-ng fonts-indic

      - name: Cache AI Models (Whisper & HF Hub)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/whisper
            ~/.cache/huggingface
          key: ${{ runner.os }}-ai-models-v1
          restore-keys: |
            ${{ runner.os }}-ai-models-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m spacy download en_core_web_sm || true

      - name: Setup Original YouTube Agent Skill
        run: |
          mkdir -p youtube_agent_skills
          if [ ! -d "youtube_agent_skills/youtube-agent-skill" ]; then
            git clone https://github.com/Jakeschincariol/youtube-agent-skill.git youtube_agent_skills/youtube-agent-skill
          fi

      - name: Setup YouTube Credentials
        run: |
          mkdir -p credentials
          if [ -n "$YT_TOKEN_CH3_B64" ]; then
            printf '%s' "$YT_TOKEN_CH3_B64" | base64 -d > credentials/channel_3_token.json
            cp credentials/channel_3_token.json credentials/token.json
            echo "✅ Channel 3 token configured"
          fi
          if [ -n "$YT_CLIENT_B64" ]; then
            printf '%s' "$YT_CLIENT_B64" | base64 -d > credentials/client_secrets.json
            echo "✅ Client secrets configured"
          fi

      - name: Render Channel 3 Short
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          PILLAR="${{ github.event.inputs.pillar }}"
          PRIVACY="${{ github.event.inputs.privacy || 'unlisted' }}"

          CMD=(python fleet_engines/channel_3/run_channel_3.py --voice dynamic --lang 'hi' --privacy "$PRIVACY")
          if [ -n "$PILLAR" ] && [ "$PILLAR" != "auto" ]; then
            CMD+=(--pillar "$PILLAR")
          fi
          if [ -n "$TOPIC" ]; then
            CMD+=(--topic "$TOPIC")
          fi
          if [ "${{ github.event.inputs.auto_upload }}" = "true" ]; then
            CMD+=(--upload)
          fi

          echo "🌌 Starting Channel 3 (Cosmic Science Hindi): ${CMD[*]}"
          "${CMD[@]}"

      - name: Persist Channel 3 Topic History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fleet_engines/state/channel_3_history.json || true
          git commit -m "Auto: Update Channel 3 topic history [skip ci]" || true
          git push origin main || git push || true

      - name: Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-3-rendered-video
          path: |
            fleet_engines/output/channel_3*/**/*.mp4
            fleet_engines/output/channel_3*/**/*.json
          retention-days: 14
          if-no-files-found: warn
