name: Autonomous Daily Instagram Reels & Telegram Dispatch

on:
  schedule:
    # 8:00 AM UTC = 1:30 PM IST (Afternoon Slot)
    - cron: '0 8 * * *'
    # 2:00 PM UTC = 7:30 PM IST (Evening Slot)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing Slot (afternoon, evening, auto, test)'
        required: true
        default: 'auto'

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Execute Daily Reels Autopilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          MEESHO_AFFILIATE_ID: ${{ secrets.MEESHO_AFFILIATE_ID || '374453404' }}
        run: |
          SLOT_ARG="${{ github.event.inputs.slot || 'auto' }}"
          python scripts/autopilot_daily_reels.py --slot=$SLOT_ARG

      - name: Commit & Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/published_reels_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(history): record published reels [skip ci]"
          git push origin main || echo "No changes or push skipped"
