name: Auto Video Render Factory (Channel 1 & 2)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Select Channel to Render'
        required: true
        default: '2'
        type: choice
        options:
          - '1' # Channel 1: Reddit Drama & Confessions
          - '2' # Channel 2: Vox Mystery & Documentary
      lang:
        description: 'Language (Hindi or English)'
        required: true
        default: 'hi'
        type: choice
        options:
          - 'hi'
          - 'en'
      topic:
        description: 'Custom Topic / Title (Optional)'
        required: false
        default: ''
        type: string
      auto_upload:
        description: 'Auto-Upload to YouTube?'
        required: true
        default: true
        type: boolean
      privacy:
        description: 'YouTube Video Privacy (unlisted/public/private)'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - 'unlisted'
          - 'public'
          - 'private'

  schedule:
    # Automatically triggers every day at 11:30 UTC (5:00 PM IST)
    - cron: '30 11 * * *'

jobs:
  render_video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YT_TOKEN_CH1_B64: ${{ secrets.YT_TOKEN_CH1_B64 }}
      YT_TOKEN_CH2_B64: ${{ secrets.YT_TOKEN_CH2_B64 || secrets.YT_TOKEN_B64 }}
      YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8809830963:AAG22CFChal-D13uSkNLUmCoyHD3FGvgWjY' }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6486771356' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 fonts-liberation

      - name: Install Required Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install httpx pillow numpy soundfile edge-tts openai opencv-python-headless openai-whisper python-dotenv requests moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Setup Multi-Channel YouTube Credentials from GitHub Secrets
        run: |
          mkdir -p credentials
          if [ -n "$YT_TOKEN_CH1_B64" ]; then
            printf '%s' "$YT_TOKEN_CH1_B64" | base64 -d > credentials/channel_1_token.json
            echo "✅ Decoded channel_1_token.json (Reddit Drama) from Secrets"
          fi
          if [ -n "$YT_TOKEN_CH2_B64" ]; then
            printf '%s' "$YT_TOKEN_CH2_B64" | base64 -d > credentials/channel_2_token.json
            cp credentials/channel_2_token.json credentials/token.json
            echo "✅ Decoded channel_2_token.json (Vox Mystery) from Secrets"
          fi
          if [ -n "$YT_CLIENT_B64" ]; then
            printf '%s' "$YT_CLIENT_B64" | base64 -d > credentials/client_secrets.json
            echo "✅ Decoded client_secrets.json from Secrets"
          fi

      - name: Render Video via Fleet Dispatcher
        run: |
          CHANNEL="${{ github.event.inputs.channel || '2' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"
          LANG="${{ github.event.inputs.lang || 'hi' }}"
          
          echo "🚀 Starting Automated Render: Channel $CHANNEL | Lang $LANG | Topic $TOPIC"
          
          if [ "$CHANNEL" = "1" ]; then
            python fleet_engines/channel_1/run_reddit_pipeline.py "Subway Surfers"
          else
            python fleet_engines/channel_2/run_channel_2.py --pillar 1 --lang "$LANG" --topic "$TOPIC"
          fi

      - name: Auto-Upload to YouTube
        if: ${{ github.event.inputs.auto_upload != 'false' }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || '2' }}"
          LATEST_VIDEO=$(ls -t fleet_engines/output/**/*.mp4 2>/dev/null | head -n 1)
          PRIVACY="${{ github.event.inputs.privacy || 'unlisted' }}"
          TOKEN_PATH="credentials/channel_${CHANNEL}_token.json"
          if [ ! -f "$TOKEN_PATH" ] && [ "$CHANNEL" = "2" ]; then
            TOKEN_PATH="credentials/token.json"
          fi
          
          if [ -n "$LATEST_VIDEO" ] && [ -f "$TOKEN_PATH" ]; then
            echo "📤 Uploading $LATEST_VIDEO to YouTube Channel $CHANNEL ($PRIVACY)..."
            python fleet_engines/channel_2/youtube_uploader.py --video "$LATEST_VIDEO" --privacy "$PRIVACY" || echo "⚠️ YouTube upload failed, check logs"
          else
            echo "ℹ️ Skipping auto-upload: either no video found or credentials pending for Channel $CHANNEL."
          fi

      - name: Send Video to Telegram
        if: always()
        run: |
          LATEST_VIDEO=$(ls -t fleet_engines/output/**/*.mp4 2>/dev/null | head -n 1)
          if [ -n "$LATEST_VIDEO" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "📱 Delivering video directly to Telegram..."
            curl -s -F "chat_id=$TELEGRAM_CHAT_ID" -F "video=@$LATEST_VIDEO" -F "caption=🎬 New Fleet Short Ready! ($LATEST_VIDEO)" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" || true
          fi

      - name: Upload Rendered Videos & Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ready-shorts
          path: |
            fleet_engines/output/**/*.mp4
            fleet_engines/output/**/*.json
          retention-days: 14
