name: Auto Video Render Factory (Channel 1, 2 & 3)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Select Channel to Render'
        required: true
        default: '3'
        type: choice
        options:
          - '3'    # Channel 3: Cosmic What-If & Dark Science (Hindi Kokoro Dynamic, Real 4K)
          - '2'    # Channel 2: Vox Mystery Documentary (English Kokoro Michael, Real 4K)
          - '1'    # Channel 1: Reddit Drama (Dynamic GTA 5 / Subway Surfers)
          - 'all'  # Render ALL Channels (1, 2 & 3)
      lang:
        description: 'Language for Channel 2 (en or hi)'
        required: true
        default: 'en'
        type: choice
        options:
          - 'en'
          - 'hi'
      topic:
        description: 'Custom Topic / Title (Optional)'
        required: false
        default: ''
        type: string
      script:
        description: 'Custom Script Text (Optional - Leave empty for Auto AI Storyteller)'
        required: false
        default: ''
        type: string
      auto_upload:
        description: 'Auto-Upload to YouTube? (Unlisted Default)'
        required: true
        default: true
        type: boolean
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - 'unlisted'
          - 'public'
          - 'private'

  schedule:
    # Automatically triggers every day at 11:30 UTC (5:00 PM IST)
    - cron: '30 11 * * *'

jobs:
  render_video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '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' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || 'Ng530LMnrpm85zReE4lMhjCD7wm5Pc6h8rTE8NfSsuS7be57Qe7C1AGT' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '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' }}
      YT_TOKEN_CH1_B64: ${{ secrets.YT_TOKEN_CH1_B64 }}
      YT_TOKEN_CH2_B64: ${{ secrets.YT_TOKEN_CH2_B64 || secrets.YT_TOKEN_B64 }}
      YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8809830963:AAG22CFChal-D13uSkNLUmCoyHD3FGvgWjY' }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6486771356' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || 'sk_f27562b3dda4dd4c2b6bda43c7205548e5a35bc966403310' }}
      ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
      ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev libsm6 libxext6 fonts-liberation fonts-noto-core fonts-dejavu espeak-ng fonts-indic

      - name: Install Required Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Setup Original YouTube Agent Skill
        run: |
          mkdir -p youtube_agent_skills
          if [ ! -d "youtube_agent_skills/youtube-agent-skill" ]; then
            git clone https://github.com/Jakeschincariol/youtube-agent-skill.git youtube_agent_skills/youtube-agent-skill
          fi

      - name: Setup Multi-Channel YouTube Credentials from GitHub Secrets
        run: |
          mkdir -p credentials
          if [ -n "$YT_TOKEN_CH1_B64" ]; then
            printf '%s' "$YT_TOKEN_CH1_B64" | base64 -d > credentials/channel_1_token.json
            echo "✅ Decoded channel_1_token.json (Reddit Drama) from Secrets"
          fi
          if [ -n "$YT_TOKEN_CH2_B64" ]; then
            printf '%s' "$YT_TOKEN_CH2_B64" | base64 -d > credentials/channel_2_token.json
            cp credentials/channel_2_token.json credentials/token.json
            echo "✅ Decoded channel_2_token.json (Vox Mystery) from Secrets"
          fi
          if [ -n "$YT_CLIENT_B64" ]; then
            printf '%s' "$YT_CLIENT_B64" | base64 -d > credentials/client_secrets.json
            echo "✅ Decoded client_secrets.json from Secrets"
          fi

      - name: Render Video via Fleet Dispatcher
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_SCRIPT: ${{ github.event.inputs.script }}
          INPUT_LANG: ${{ github.event.inputs.lang }}
          INPUT_PRIVACY: ${{ github.event.inputs.privacy }}
          INPUT_AUTO_UPLOAD: ${{ github.event.inputs.auto_upload }}
        run: |
          CHANNEL="${INPUT_CHANNEL:-3}"
          TOPIC="${INPUT_TOPIC:-}"
          LANG="${INPUT_LANG:-en}"
          PRIVACY="${INPUT_PRIVACY:-unlisted}"
          UPLOAD_FLAG=""
          if [ "$INPUT_AUTO_UPLOAD" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi

          SCRIPT_ARG=""
          if [ -n "$INPUT_SCRIPT" ]; then
            mkdir -p /tmp/fleet_scripts
            printf '%s' "$INPUT_SCRIPT" > /tmp/fleet_scripts/custom_script.txt
            SCRIPT_ARG="--script_file /tmp/fleet_scripts/custom_script.txt"
          fi

          TOPIC_ARG=""
          if [ -n "$TOPIC" ]; then
            TOPIC_ARG="--topic \"$TOPIC\" --title \"$TOPIC\""
          fi

          echo "🚀 Event: ${{ github.event_name }} | Channel: $CHANNEL | Lang: $LANG"

          if [ "$CHANNEL" = "1" ]; then
            echo "🎮 Channel 1: Rendering Reddit Drama Short with Dynamic Gameplay..."
            eval "python fleet_engines/channel_1/run_channel_1.py --bg dynamic $TOPIC_ARG $SCRIPT_ARG $UPLOAD_FLAG --privacy '$PRIVACY'"
          elif [ "$CHANNEL" = "2" ]; then
            C2_LANG="${LANG:-en}"
            echo "🕵️ Channel 2: Rendering Vox Mystery Short in $C2_LANG (Kokoro Michael)..."
            eval "python fleet_engines/channel_2/run_channel_2.py --pillar 1 --lang '$C2_LANG' $TOPIC_ARG $SCRIPT_ARG $UPLOAD_FLAG --privacy '$PRIVACY'"
          elif [ "$CHANNEL" = "3" ]; then
            echo "🌌 Channel 3: Rendering High-Cadence Cosmic Video with Dynamic Kokoro Hindi Voices..."
            eval "python fleet_engines/channel_3/run_channel_3.py --pillar 1 --voice dynamic --lang 'hi' $TOPIC_ARG $SCRIPT_ARG $UPLOAD_FLAG --privacy '$PRIVACY'"
          else
            echo "🔥 Full Fleet Autopilot: Rendering All 3 Channels (Channel 1 Reddit, Channel 2 Vox En, Channel 3 Cosmic Hi)!"
            eval "python fleet_engines/channel_1/run_channel_1.py --bg dynamic $UPLOAD_FLAG --privacy '$PRIVACY'" || true
            eval "python fleet_engines/channel_2/run_channel_2.py --pillar 1 --lang 'en' $UPLOAD_FLAG --privacy '$PRIVACY'" || true
            eval "python fleet_engines/channel_3/run_channel_3.py --pillar 1 --voice dynamic --lang 'hi' $UPLOAD_FLAG --privacy '$PRIVACY'" || true
          fi

      - name: Upload Rendered Videos & Metadata Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ready-shorts
          path: |
            fleet_engines/output/**/*.mp4
            fleet_engines/output/**/*.json
          retention-days: 14
          if-no-files-found: warn
