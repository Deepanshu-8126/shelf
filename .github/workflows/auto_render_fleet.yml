name: Auto Video Render Factory (Channel 1, 2 & 3)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Select Channel to Render'
        required: true
        default: '3'
        type: choice
        options:
          - '3'    # Channel 3: Cosmic What-If & Dark Science (Real 4K)
          - '2'    # Channel 2: Hindi Vox Mystery (Real 4K)
          - '1'    # Channel 1: Reddit Drama (Funcyous)
          - 'all'  # Render ALL Channels (1, 2 & 3)
      lang:
        description: 'Language for Channel 2 (hi or en)'
        required: true
        default: 'hi'
        type: choice
        options:
          - 'hi'
          - 'en'
      topic:
        description: 'Custom Topic / Title (Optional)'
        required: false
        default: ''
        type: string
      script:
        description: 'Custom Script Text (Optional - Leave empty for Auto AI Storyteller)'
        required: false
        default: ''
        type: string
      auto_upload:
        description: 'Auto-Upload to YouTube? (Unlisted Default)'
        required: true
        default: true
        type: boolean
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - 'unlisted'
          - 'public'
          - 'private'

  schedule:
    # Automatically triggers every day at 11:30 UTC (5:00 PM IST)
    - cron: '30 11 * * *'

jobs:
  render_video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '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' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || 'Ng530LMnrpm85zReE4lMhjCD7wm5Pc6h8rTE8NfSsuS7be57Qe7C1AGT' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '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' }}
      YT_TOKEN_CH1_B64: ${{ secrets.YT_TOKEN_CH1_B64 }}
      YT_TOKEN_CH2_B64: ${{ secrets.YT_TOKEN_CH2_B64 || secrets.YT_TOKEN_B64 }}
      YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8809830963:AAG22CFChal-D13uSkNLUmCoyHD3FGvgWjY' }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6486771356' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || 'sk_f27562b3dda4dd4c2b6bda43c7205548e5a35bc966403310' }}
      ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
      ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 fonts-liberation

      - name: Install Required Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install httpx pillow numpy soundfile edge-tts openai opencv-python-headless openai-whisper whisper-timestamped python-dotenv requests moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2 pyyaml tinydb tinymongo pandas yt-dlp tiktoken tqdm progress questionary kokoro

      - name: Setup Multi-Channel YouTube Credentials from GitHub Secrets
        run: |
          mkdir -p credentials
          if [ -n "$YT_TOKEN_CH1_B64" ]; then
            printf '%s' "$YT_TOKEN_CH1_B64" | base64 -d > credentials/channel_1_token.json
            echo "✅ Decoded channel_1_token.json (Reddit Drama) from Secrets"
          fi
          if [ -n "$YT_TOKEN_CH2_B64" ]; then
            printf '%s' "$YT_TOKEN_CH2_B64" | base64 -d > credentials/channel_2_token.json
            cp credentials/channel_2_token.json credentials/token.json
            echo "✅ Decoded channel_2_token.json (Vox Mystery) from Secrets"
          fi
          if [ -n "$YT_CLIENT_B64" ]; then
            printf '%s' "$YT_CLIENT_B64" | base64 -d > credentials/client_secrets.json
            echo "✅ Decoded client_secrets.json from Secrets"
          fi

      - name: Render Video via Fleet Dispatcher
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'all' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"
          CUSTOM_SCRIPT="${{ github.event.inputs.script || '' }}"
          LANG="${{ github.event.inputs.lang || 'hi' }}"
          PRIVACY="${{ github.event.inputs.privacy || 'unlisted' }}"
          UPLOAD_FLAG=""
          if [ "${{ github.event.inputs.auto_upload }}" != "false" ]; then
            UPLOAD_FLAG="--upload"
          fi
          
          echo "🚀 Event: ${{ github.event_name }} | Channel: $CHANNEL | Lang: $LANG"
          
          if [ "$CHANNEL" = "1" ]; then
            python fleet_engines/channel_1/run_reddit_pipeline.py "Subway Surfers" --title "$TOPIC" --script "$CUSTOM_SCRIPT" $UPLOAD_FLAG --privacy "$PRIVACY"
          elif [ "$CHANNEL" = "2" ]; then
            python fleet_engines/channel_2/run_channel_2.py --pillar 1 --lang "$LANG" --topic "$TOPIC" --title "$TOPIC" --script "$CUSTOM_SCRIPT" $UPLOAD_FLAG --privacy "$PRIVACY"
          elif [ "$CHANNEL" = "3" ]; then
            echo "🌌 Channel 3: Rendering Cosmic Video..."
            python fleet_engines/channel_3/run_channel_3.py --pillar 1 --lang "$LANG" --topic "$TOPIC" --title "$TOPIC" --script "$CUSTOM_SCRIPT"
            if [ -z "$CUSTOM_SCRIPT" ]; then
              echo "🌌 Channel 3: Rendering Daily Video 2 (Mind-Bending What-Ifs)..."
              python fleet_engines/channel_3/run_channel_3.py --pillar 2 --lang "$LANG"
            fi
          else
            echo "🔥 Full Fleet Autopilot: Rendering Channel 2 (Vox 4K) & Channel 3 (Cosmic 4K Videos)!"
            python fleet_engines/channel_2/run_channel_2.py --pillar 1 --lang "$LANG" --topic "$TOPIC" --title "$TOPIC" --script "$CUSTOM_SCRIPT" $UPLOAD_FLAG --privacy "$PRIVACY"
            python fleet_engines/channel_3/run_channel_3.py --pillar 1 --lang "$LANG"
            if [ -z "$CUSTOM_SCRIPT" ]; then
              python fleet_engines/channel_3/run_channel_3.py --pillar 2 --lang "$LANG"
            fi
          fi

      - name: Upload Rendered Videos & Metadata Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ready-shorts
          path: |
            fleet_engines/output/**/*.mp4
            fleet_engines/output/**/*.json
          retention-days: 14
