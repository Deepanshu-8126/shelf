name: Render Khuda Jaane Viral Short & Hook Masters

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/render_khuda_jaane_short.yml'
      - 'lofi_phonk_empire/core/render_khuda_jaane_short.py'
      - 'lofi_phonk_empire/raw_stems/audio/khuda_jaane_viral_hook_44s.mp3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render_shorts:
    name: Cloud Render Khuda Jaane Viral Short & Hook
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy scipy

      - name: Render Vertical 9:16 Viral Short (1080x1920)
        run: |
          python lofi_phonk_empire/core/render_khuda_jaane_short.py 9x16

      - name: Render Horizontal 16:9 Viral Hook (1280x720)
        run: |
          python lofi_phonk_empire/core/render_khuda_jaane_short.py 16x9

      - name: Verify Output Files
        run: |
          ls -lh lofi_phonk_empire/output/reels_9x16/khuda_jaane_viral_short_9x16.mp4
          ls -lh lofi_phonk_empire/output/youtube_16x9/khuda_jaane_viral_hook_16x9.mp4

      - name: Upload 9:16 Vertical Short Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHUDA_JAANE_VIRAL_SHORT_9x16
          path: lofi_phonk_empire/output/reels_9x16/khuda_jaane_viral_short_9x16.mp4
          retention-days: 90

      - name: Upload 16:9 Horizontal Hook Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHUDA_JAANE_VIRAL_HOOK_16x9
          path: lofi_phonk_empire/output/youtube_16x9/khuda_jaane_viral_hook_16x9.mp4
          retention-days: 90

      - name: Create GitHub Release with Viral Short Masters
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/clean-fleet') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: khuda-jaane-short-${{ github.run_number }}
          name: "Khuda Jaane – Viral Hook & Short Masters (KK & Shilpa Rao)"
          body: |
            ### 🌊 Khuda Jaane – Viral Hook Short Masters
            - **Track Selection**: 44.5s Viral Drop Hook ("Hum ko kya lena hai sab se... Ban gaye ho tum meri dua... Khuda Jaane ke mein fida hun!").
            - **Visuals**: Untouched Dreamina cinematic video plate with seamless ping-pong loop.
            - **Typography**: Rock-solid stationary calligraphy (`Dancing Script`) with localized Gaussian drop-shadows.
            - **Formats Included**:
                * `khuda_jaane_viral_short_9x16.mp4` - 9:16 Vertical Full HD (1080x1920) for YouTube Shorts & Instagram Reels.
                * `khuda_jaane_viral_hook_16x9.mp4` - 16:9 Horizontal HD (1280x720) Lyrical Mode Master.
          files: |
            lofi_phonk_empire/output/reels_9x16/khuda_jaane_viral_short_9x16.mp4
            lofi_phonk_empire/output/youtube_16x9/khuda_jaane_viral_hook_16x9.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
