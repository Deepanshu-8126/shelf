name: Vox Studio

on:
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Select YouTube Channel'
        required: true
        type: choice
        default: 'Channel 1 (Space & Science - FactShorts)'
        options:
          - 'Channel 1 (Space & Science - FactShorts)'
          - 'Channel 2 (Dark Mysteries & Geopolitics - Case Studio)'
          - 'Custom Vox Masterpiece'
      topic:
        description: 'Video Topic (Leave blank for Channel Auto-Selection / Google Trends)'
        required: false
        default: ''
      voice_narrator:
        description: 'Narrator Voice'
        required: true
        type: choice
        default: 'Brian (Deep Vox / Johnny Harris Style)'
        options:
          - 'Brian (Deep Vox / Johnny Harris Style)'
          - 'Marcus (Forensic Investigator)'
          - 'Adam (Documentary Narration)'
      auto_trends:
        description: 'Fetch Realtime Breakout Trends from Google Trends (true/false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  produce-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup Node.js & Chromium for HyperFrames
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-generativeai yt-dlp pillow pytrends httpx

      - name: Setup Channel YouTube Credentials
        env:
          TARGET_CH: ${{ github.event.inputs.target_channel || 'Channel 1 (Space & Science - FactShorts)' }}
          YT_TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
          YT_TOKEN_CH2_B64: ${{ secrets.YT_TOKEN_CH2_B64 || secrets.YT_TOKEN_B64 }}
          YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
        run: |
          mkdir -p credentials
          if [[ "$TARGET_CH" == *"Channel 2"* ]]; then
            echo "🔑 Configured credentials for Channel 2"
            [ -n "$YT_TOKEN_CH2_B64" ] && printf '%s' "$YT_TOKEN_CH2_B64" | base64 -d > credentials/token.json || true
          else
            echo "🔑 Configured credentials for Channel 1"
            [ -n "$YT_TOKEN_B64" ] && printf '%s' "$YT_TOKEN_B64" | base64 -d > credentials/token.json || true
          fi
          [ -n "$YT_CLIENT_B64" ] && printf '%s' "$YT_CLIENT_B64" | base64 -d > credentials/client_secret.json || true

      - name: Execute Vox Studio Production Pipeline
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || 'sk_f27562b3dda4dd4c2b6bda43c7205548e5a35bc966403310' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          TARGET_CH="${{ github.event.inputs.target_channel || 'Channel 1 (Space & Science - FactShorts)' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"
          AUTO_TRENDS="${{ github.event.inputs.auto_trends || 'false' }}"

          CH_FLAG="channel_1"
          if [[ "$TARGET_CH" == *"Channel 2"* ]]; then
            CH_FLAG="channel_2"
          fi

          if [ "$AUTO_TRENDS" = "true" ]; then
            python -m vox_studio.cli trends --limit 3 --auto-produce
          elif [ -n "$TOPIC" ]; then
            python -m vox_studio.cli create "$TOPIC" --channel "$CH_FLAG"
          else
            python -m vox_studio.cli create "" --channel "$CH_FLAG"
          fi

      - name: 📱 Send Video Directly to Telegram Phone
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8809830963:AAG22CFChal-D13uSkNLUmCoyHD3FGvgWjY' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6486771356' }}
        run: |
          python send_to_telegram.py vox_studio/output || true

      - name: Upload Finished Master Videos and Thumbnails as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vox-channel-production-bundle
          path: |
            vox_studio/output/*.mp4
            vox_studio/output/*.jpg
            vox_studio/output/*.png
          retention-days: 14
