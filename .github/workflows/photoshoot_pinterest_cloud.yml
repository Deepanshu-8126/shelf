name: Fashion Photoshoot & Pinterest 4K Post Generator

on:
  workflow_dispatch:
    inputs:
      max_photos:
        description: 'Maximum Photos to Process (e.g. 5, 20, or 125)'
        required: true
        default: '10'
      dispatch_telegram:
        description: 'Send 4K Posts Directly to Telegram (true/false)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate-photoshoot-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pandas requests

      - name: Run 4K Photoshoot & Delogo Generator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8809830963:AAG22CFChal-D13uSkNLUmCoyHD3FGvgWjY' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6486771356' }}
        run: |
          mkdir -p photoshoot_pinterest_engine/raw_photos photoshoot_pinterest_engine/rendered_posts
          python photoshoot_pinterest_engine/cloud_photoshoot_runner.py --max ${{ github.event.inputs.max_photos }} --telegram

      - name: Upload 4K Rendered Posts & Prompts Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4k-pinterest-photoshoot-posts
          path: |
            photoshoot_pinterest_engine/rendered_posts/*.jpg
            photoshoot_pinterest_engine/master_125_photoshoot_prompts.json
            photoshoot_pinterest_engine/master_125_photoshoot_prompts.csv
          retention-days: 14
