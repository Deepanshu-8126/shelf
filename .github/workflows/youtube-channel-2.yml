name: YouTube Shorts - Channel 2 (Mysteries & History)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Mystery / History Topic (Leave empty for Auto-Discovery)'
        required: false
        default: ''
      auto_upload:
        description: 'Upload to YouTube automatically?'
        required: true
        type: boolean
        default: true
      privacy:
        description: 'Video Privacy'
        required: true
        type: choice
        default: 'unlisted'
        options:
          - 'unlisted'
          - 'public'
          - 'private'

permissions:
  contents: write

jobs:
  generate_and_upload_ch2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factshorts-bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup YouTube Credentials (Channel 2)
        env:
          YT_TOKEN_CH2_B64: ${{ secrets.YT_TOKEN_CH2_B64 || secrets.YT_TOKEN_B64 }}
          YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
        run: |
          mkdir -p credentials
          [ -n "$YT_TOKEN_CH2_B64" ] && printf '%s' "$YT_TOKEN_CH2_B64" | base64 -d > credentials/token.json || true
          [ -n "$YT_CLIENT_B64" ]    && printf '%s' "$YT_CLIENT_B64"    | base64 -d > credentials/client_secret.json || true
          python3 -c "import json; json.load(open('credentials/token.json')); print('✅ token.json is valid JSON for Channel 2')" 2>/dev/null || echo "❌ token.json is NOT valid JSON"

      - name: Generate Short Video (Unsolved History & Mysteries Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FOOTAGE_PROVIDERS: pexels,pixabay,nasa,wikimedia,local
          LLM_PROVIDER: gemini
          NICHE: history
          VIDEO_MODE: story
          SCRIPT_STYLE: documentary
          SCRIPT_LANGUAGE: english
          VOICE_PROVIDER: edge
          VOICE: en-US-ChristopherNeural
          TOPIC_INPUT: ${{ github.event.inputs.topic }}
          AUTO_UPLOAD: ${{ github.event.inputs.auto_upload }}
          PRIVACY_OPT: ${{ github.event.inputs.privacy || 'unlisted' }}
        run: |
          CMD="python main.py --generate history --mode story"
          if [ -n "$TOPIC_INPUT" ]; then
            CMD="$CMD --topic \"$TOPIC_INPUT\""
          fi
          if [ "$AUTO_UPLOAD" = "true" ] || [ "$AUTO_UPLOAD" = "" ]; then
            CMD="$CMD --upload 1 --privacy $PRIVACY_OPT"
          fi
          echo "Executing: $CMD"
          eval $CMD || echo "⚠️ Generation/upload step ended with code $?"

      - name: Save Rendered Video Artifact (Never Lose Video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-2-rendered-videos
          path: factshorts-bot/output/*.mp4
          retention-days: 14

      - name: Keep topic memory (Never repeat topics or clips)
        if: always()
        run: |
          git config user.name  "factshorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/factshorts.db 2>/dev/null || true
          git commit -m "chore: topic memory update $(date -u +%F-%H%M)" || echo "nothing to commit"
          git push || echo "push skipped"
