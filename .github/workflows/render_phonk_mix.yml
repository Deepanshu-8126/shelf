name: Render 35-Minute Phonk Mix Master

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/render_phonk_mix.yml'
      - 'lofi_phonk_empire/core/cloud_phonk_render.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Cloud 1080p Master Video Render
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy scipy yt-dlp

      - name: Render Full 35-Minute Phonk Video Master
        run: |
          python lofi_phonk_empire/core/cloud_phonk_render.py

      - name: Verify Output File
        run: |
          ls -lh lofi_phonk_empire/output/AURA_VIRAL_PHONK_2026_MASTER.mp4

      - name: Upload Master Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA_VIRAL_PHONK_2026_MASTER
          path: lofi_phonk_empire/output/AURA_VIRAL_PHONK_2026_MASTER.mp4
          retention-days: 90

      - name: Create GitHub Release with Master Video
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/clean-fleet') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: phonk-aura-35m-${{ github.run_number }}
          name: "AURA VIRAL PHONK 2026 (35 Min Master 1080p)"
          body: |
            ### ⚡ AURA VIRAL PHONK PLAYLIST 2026 (35-Minute Master)
            - **Resolution**: 1080p @ 30 FPS Master
            - **Audio**: 320kbps High Fidelity Mix
            - **Visualizer**: Audio-Reactive Soundwave Dagger Blade (Gym Warrior Edition)
            - **Tracks Included**: 19 Brazilian Phonk & Funk Viral Anthems
            - **Overlays**: 808 Sub-Bass Camera Shake, Embers & Floating Bokeh, 35mm Film Grain
          files: lofi_phonk_empire/output/AURA_VIRAL_PHONK_2026_MASTER.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
