name: Render 35-Minute Phonk Mix Master

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/render_phonk_mix.yml'
      - 'lofi_phonk_empire/core/cloud_phonk_render.py'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Render Duration in seconds (e.g. 1200 for 20m, 2100 for 35m)'
        required: false
        default: '1200'

permissions:
  contents: write

jobs:
  render:
    name: Cloud 1080p Master Video Render
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy scipy yt-dlp

      - name: Render Full Phonk Video Master
        run: |
          python lofi_phonk_empire/core/cloud_phonk_render.py --duration ${{ github.event.inputs.duration || '1200' }}

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render_failure_logs
          path: |
            render_error.log
            *.log

      - name: Verify Output File
        run: |
          ls -lh lofi_phonk_empire/output/AURA_VIRAL_PHONK_2026_MASTER.mp4

      - name: Upload Master Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA_VIRAL_PHONK_2026_MASTER
          path: lofi_phonk_empire/output/AURA_VIRAL_PHONK_2026_MASTER.mp4
          retention-days: 90

      - name: Create GitHub Release with Master Video
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/clean-fleet') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: phonk-aura-gym-${{ github.run_number }}
          name: "AURA VIRAL GYM PHONK 2026 (1080p Master)"
          body: |
            ### ⚡ AURA VIRAL GYM PHONK 2026 (Ultra HD 1080p Master)
            - **Template**: Muscular Anime Gym Warrior with Electric Lightning Loop
            - **Resolution**: 1080p @ 24 FPS Master (CRF 18 Crisp)
            - **Audio**: 320kbps High Fidelity Brazilian Phonk & Montagem Mix
            - **Visualizer**: Real-Time Audio-Reactive Golden Lightning Spectrum Visualizer
            - **Dynamics**: 808 Sub-Bass Camera Micro-Shake & Chapter Track Synchronization
          files: lofi_phonk_empire/output/AURA_VIRAL_PHONK_2026_MASTER.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
