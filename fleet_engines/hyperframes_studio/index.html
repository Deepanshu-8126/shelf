<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-id="main"
  data-composition-duration="4"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "default": "1962: FBI Secret Document Unsealed" },
    { "id": "keyword", "type": "string", "role": "content", "label": "Keyword", "default": "Secret Document" },
    { "id": "note", "type": "string", "role": "content", "label": "Note", "default": "CLASSIFIED" },
    { "id": "style", "type": "enum", "role": "style", "label": "Marker style", "default": "circle" },
    { "id": "draw_at", "type": "number", "role": "timing", "label": "Draw at", "default": 0.8 },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "default": "green" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "default": "none" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>HyperFrames Vox Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08090a;
      }
      #root {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        container-type: size;
        isolation: isolate;
        background: radial-gradient(circle at center, #15181e 0%, #07080a 100%);
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        pointer-events: none;
      }
      .va-clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .va-stage {
        max-width: 86cqw;
        text-align: center;
        will-change: transform, opacity;
      }
      .va-text {
        margin: 0;
        font-size: var(--va-font-size, min(8cqw, 15cqh));
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.02em;
        text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      }
      .va-em {
        position: relative;
        display: inline-block;
        white-space: nowrap;
        will-change: transform;
      }
      .va-em-text {
        position: relative;
        z-index: 1;
      }
      .va-mark {
        position: absolute;
        z-index: 0;
        overflow: visible;
      }
      .va-em[data-marker-style="highlight"] .va-mark {
        left: -3%;
        top: 14%;
        width: 106%;
        height: 76%;
      }
      .va-em[data-marker-style="underline"] .va-mark {
        left: -2%;
        bottom: -14%;
        width: 105%;
        height: 22%;
        z-index: 2;
      }
      .va-em[data-marker-style="circle"] .va-mark {
        left: -13%;
        top: -26%;
        width: 126%;
        height: 152%;
        z-index: 2;
      }
      .va-em[data-marker-style="scribble"] .va-mark {
        left: -2%;
        top: 12%;
        width: 104%;
        height: 76%;
        z-index: 2;
      }
      .va-anno {
        position: absolute;
        left: 55%;
        bottom: calc(100% + 1.6cqh);
        width: 26cqw;
        height: 19cqh;
        z-index: 3;
      }
      .va-conn {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .va-note {
        position: absolute;
        top: -1.2cqh;
        right: -2cqw;
        max-width: 32cqw;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: min(2.8cqw, 4.4cqh);
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.25;
        text-align: left;
        white-space: nowrap;
        text-transform: uppercase;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="vox-annotate-clip"
        class="va-clip clip"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      >
        <div class="va-stage">
          <p class="va-text"></p>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        var root = document.getElementById("root");
        var compositionId = "main";
        var stage = root.querySelector(".va-stage");
        var textEl = root.querySelector(".va-text");
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};

        var text =
          vars.text == null
            ? "1962: FBI Secret Document Unsealed"
            : String(vars.text).trim().replace(/\s+/g, " ");
        var keyword =
          vars.keyword == null ? "Secret Document" : String(vars.keyword).trim().replace(/\s+/g, " ");
        var note =
          vars.note == null
            ? "CLASSIFIED"
            : String(vars.note).trim().replace(/\s+/g, " ");
        var accentColors = {
          green: "#00ff88",
          blue: "#38bdf8",
          violet: "#c084fc",
          red: "#ef4444",
          yellow: "#facc15"
        };
        var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
          ? vars.accent
          : "green";
        var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

        var markerStyles = {
          highlight: {
            viewBox: "0 0 100 40",
            d: "M 3 24 C 22 20.5, 47 25.5, 68 22.5 C 79 21, 90 23, 97 21.5",
            strokeWidth: 26,
            opacity: 0.5,
          },
          circle: {
            viewBox: "0 0 100 40",
            d: "M 22 7 C 58 1, 95 8, 97 20 C 99 31, 74 38, 44 37 C 16 36, 2 29, 3 19 C 4 10, 22 4, 52 4.5",
            strokeWidth: 3.2,
            opacity: 1,
          },
          underline: {
            viewBox: "0 0 100 12",
            d: "M 2 7 C 20 4.5, 46 8.5, 66 6 C 80 4.5, 92 7.5, 98 5.5",
            strokeWidth: 4.5,
            opacity: 1,
          },
          scribble: {
            viewBox: "0 0 100 40",
            d: "M 6 13 C 34 9.5, 66 11, 94 9 C 60 15, 26 16, 7 20 C 36 18, 68 21, 93 18 C 62 25, 28 27, 8 29",
            strokeWidth: 5,
            opacity: 0.65,
          },
        };
        var styleName = Object.prototype.hasOwnProperty.call(markerStyles, vars.style)
          ? vars.style
          : "circle";
        var marker = markerStyles[styleName];
        var svgNS = "http://www.w3.org/2000/svg";

        var lowerText = text.toLowerCase();
        var lowerKeyword = keyword.toLowerCase();
        var matchIndex = keyword.length > 0 ? lowerText.indexOf(lowerKeyword) : -1;

        var markPath = null;
        var connPath = null;
        var noteEl = null;

        while (textEl.firstChild) textEl.removeChild(textEl.firstChild);

        if (matchIndex >= 0) {
          var before = text.slice(0, matchIndex);
          var matched = text.slice(matchIndex, matchIndex + keyword.length);
          var after = text.slice(matchIndex + keyword.length);

          if (before) textEl.appendChild(document.createTextNode(before));

          var emEl = document.createElement("span");
          emEl.className = "va-em";
          emEl.setAttribute("data-marker-style", styleName);

          var markSvg = document.createElementNS(svgNS, "svg");
          markSvg.setAttribute("class", "va-mark");
          markSvg.setAttribute("viewBox", marker.viewBox);
          markSvg.setAttribute("preserveAspectRatio", "none");
          markSvg.setAttribute("aria-hidden", "true");
          markPath = document.createElementNS(svgNS, "path");
          markPath.setAttribute("d", marker.d);
          markPath.setAttribute("fill", "none");
          markPath.setAttribute("stroke-width", String(marker.strokeWidth));
          markPath.setAttribute("stroke-linecap", "round");
          markPath.setAttribute("stroke-linejoin", "round");
          markPath.style.stroke = accentColors[accent] || "#00ff88";
          markSvg.appendChild(markPath);

          var emText = document.createElement("span");
          emText.className = "va-em-text";
          emText.textContent = matched;

          emEl.appendChild(markSvg);
          emEl.appendChild(emText);

          if (note.length > 0) {
            var anno = document.createElement("span");
            anno.className = "va-anno";
            anno.setAttribute("aria-hidden", "true");

            var connSvg = document.createElementNS(svgNS, "svg");
            connSvg.setAttribute("class", "va-conn");
            connSvg.setAttribute("viewBox", "0 0 240 100");
            connSvg.setAttribute("preserveAspectRatio", "none");
            connPath = document.createElementNS(svgNS, "path");
            connPath.setAttribute(
              "d",
              "M 10 94 C 52 82, 96 52, 148 32 C 176 21, 200 16, 218 14",
            );
            connPath.setAttribute("fill", "none");
            connPath.setAttribute("stroke-width", "3.0");
            connPath.setAttribute("stroke-linecap", "round");
            connPath.style.stroke = accentColors[accent] || "#00ff88";
            connSvg.appendChild(connPath);

            noteEl = document.createElement("span");
            noteEl.className = "va-note";
            noteEl.style.color = accentColors[accent] || "#00ff88";
            noteEl.textContent = note;

            anno.appendChild(connSvg);
            anno.appendChild(noteEl);
            emEl.appendChild(anno);
          }

          textEl.appendChild(emEl);
          if (after) textEl.appendChild(document.createTextNode(after));
        } else {
          textEl.textContent = text;
        }

        var characters = Math.max(1, Array.from(text).length);
        var fitted = Math.max(4.5, Math.min(8.5, 175 / characters));
        root.style.setProperty("--va-font-size", "min(" + fitted.toFixed(3) + "cqw, 15cqh)");

        var IN_BASE = 0.55;
        var DRAW_BASE = 0.6;
        var CONN_BASE = 0.45;
        var NOTE_BASE = 0.3;
        var POP_BASE = 0.32;
        var GESTURE_BASE = 0.96;
        var OUT_BASE = exit === "none" ? 0 : 0.45;
        var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
        var totalBase = IN_BASE + GESTURE_BASE + OUT_BASE;
        var scale = duration < totalBase ? duration / totalBase : 1;
        var IN = IN_BASE * scale;
        var DRAW = DRAW_BASE * scale;
        var CONN = CONN_BASE * scale;
        var NOTE = NOTE_BASE * scale;
        var POP = POP_BASE * scale;
        var GESTURE = GESTURE_BASE * scale;
        var OUT = OUT_BASE * scale;
        var OUT_START = duration - OUT;

        var drawAtRaw = Number(vars.draw_at);
        var drawAt = Number.isFinite(drawAtRaw) ? Math.max(0, drawAtRaw) : 0.8;
        drawAt = Math.min(drawAt, Math.max(0, OUT_START - GESTURE));

        gsap.set(stage, { opacity: 0, y: "6cqh" });

        var tl = gsap.timeline({ paused: true });

        tl.fromTo(
          stage,
          { opacity: 0, y: "6cqh" },
          { opacity: 1, y: "0cqh", duration: IN, ease: "power3.out" },
          0,
        );

        if (markPath) {
          var markLength = markPath.getTotalLength();
          markPath.style.strokeDasharray = String(markLength);
          gsap.set(markPath, { strokeDashoffset: markLength, opacity: marker.opacity });

          tl.fromTo(
            markPath,
            { strokeDashoffset: markLength },
            { strokeDashoffset: 0, duration: DRAW, ease: "power2.out" },
            drawAt,
          );

          var emTarget = textEl.querySelector(".va-em");
          tl.fromTo(
            emTarget,
            { scale: 1 },
            {
              scale: 1.05,
              duration: POP,
              ease: "power2.out",
              yoyo: true,
              repeat: 1,
            },
            drawAt + DRAW * 0.7,
          );
        }

        if (connPath) {
          var connAt = drawAt + DRAW * 0.6;
          var connLength = connPath.getTotalLength();
          connPath.style.strokeDasharray = String(connLength);
          gsap.set(connPath, { strokeDashoffset: connLength, opacity: 0 });
          tl.set(connPath, { opacity: 0.9 }, connAt);
          tl.fromTo(
            connPath,
            { strokeDashoffset: connLength },
            { strokeDashoffset: 0, duration: CONN, ease: "power2.out" },
            connAt,
          );
        }

        if (noteEl) {
          var noteAt = drawAt + DRAW * 0.6 + CONN * 0.65;
          tl.fromTo(
            noteEl,
            { opacity: 0, y: "1.6cqh" },
            { opacity: 1, y: "0cqh", duration: NOTE, ease: "power2.out" },
            noteAt,
          );
        }

        if (exit === "fade") {
          tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
        } else if (exit === "up") {
          tl.to(stage, { opacity: 0, y: "-7cqh", duration: OUT, ease: "power2.in" }, OUT_START);
        }

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines[compositionId] = tl;
      })();
    </script>
  </body>
</html>
