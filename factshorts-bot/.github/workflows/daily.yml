# Free twice-daily publishing with NO server and NOTHING running on your PC.
# Two cron slots (morning + night). See docs/DEPLOYMENT.md section 4 for trade-offs.
name: daily-short
on:
  schedule:
    - cron: "0 3 * * *"      # 03:00 UTC = 08:30 IST  (morning run)
    - cron: "0 14 * * *"     # 14:00 UTC = 19:30 IST  (night run)
  workflow_dispatch:
    inputs:
      platforms:
        description: "Where to publish"
        default: "youtube"
        type: choice
        options: ["youtube", "youtube,instagram"]
permissions:
  contents: write
concurrency:
  group: daily-short          # never let two renders run at once
  cancel-in-progress: false
jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore credentials (from repo secrets)
        env:
          YT_CLIENT_B64: ${{ secrets.YT_CLIENT_B64 }}
          YT_TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
        run: |
          mkdir -p credentials
          [ -n "$YT_CLIENT_B64" ] && echo "$YT_CLIENT_B64" | base64 -d > credentials/client_secret.json || true
          [ -n "$YT_TOKEN_B64" ]  && echo "$YT_TOKEN_B64"  | base64 -d > credentials/token.json || true

      - name: Render + publish
        env:
          # Telegram is optional here (previews + failure alerts still work)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # facts, footage, voice
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Instagram (optional)
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # behaviour
          TIMEZONE: Asia/Kolkata
          USE_TRENDS: "true"
          TRENDS_GEO: IN
          NICHE_ROTATE: "true"
          SCHEDULE_TIMES: "08:30,19:30"
        run: |
          PLATFORMS="${{ github.event.inputs.platforms || 'youtube' }}"
          echo "publishing to: $PLATFORMS"
          python main.py --generate --upload --privacy public --platforms "$PLATFORMS"

      - name: Keep the render as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: ignore

      - name: Keep topic memory (so topics are never repeated)
        if: always()
        run: |
          git config user.name  "factshorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/factshorts.db 2>/dev/null || true
          git commit -m "chore: topic memory $(date -u +%F-%H%M)" || echo "nothing to commit"
          git push || echo "push skipped"
