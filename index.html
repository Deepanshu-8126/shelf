<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Primary SEO Metadata -->
    <title>shelf. — your picks, beautifully linked</title>
    <meta name="title" content="shelf. — your picks, beautifully linked" />
    <meta name="description" content="Discover handpicked outfits, trending gadgets, beauty essentials, and creator collections with verified discounts and 1-click delivery." />
    <link rel="canonical" href="https://shelf.store/" />

    <!-- OpenGraph Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shelf Storefront" />
    <meta property="og:title" content="shelf. — your picks, beautifully linked" />
    <meta property="og:description" content="Discover handpicked outfits, trending gadgets, beauty essentials, and creator collections with verified discounts and 1-click delivery." />
    <meta property="og:url" content="https://shelf.store/" />
    <meta property="og:image" content="https://shelf.store/images/linen-set.jpg" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="shelf. — your picks, beautifully linked" />
    <meta name="twitter:description" content="Discover handpicked outfits, trending gadgets, beauty essentials, and creator collections with verified discounts and 1-click delivery." />
    <meta name="twitter:image" content="https://shelf.store/images/linen-set.jpg" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Shelf Storefront",
          "url": "https://shelf.store/",
          "description": "Creator-curated affiliate storefront and trending lifestyle reviews.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://shelf.store/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Store",
          "name": "Shelf Storefront",
          "url": "https://shelf.store/",
          "currenciesAccepted": "INR, USD",
          "paymentAccepted": "Cash on Delivery, UPI, Cards",
          "priceRange": "₹₹"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
