<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>shelf. AI Multi-Modal Fashion Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 450px; max-height: 600px; overflow-y: auto; padding: 16px; background: #0f1117; color: #f3f4f6; }
    
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand-group { display: flex; align-items: baseline; gap: 6px; }
    .brand { font-size: 18px; font-weight: 800; color: #ec4899; font-family: Georgia, serif; }
    .brand-sub { font-size: 9px; font-weight: 800; letter-spacing: .08em; color: #9ca3af; }
    .badge { font-size: 9px; font-weight: 700; background: rgba(34, 197, 94, 0.15); color: #4ade80; padding: 3px 8px; border-radius: 99px; border: 1px solid rgba(34, 197, 94, 0.3); }
    
    .product-hero-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .hero-title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 4px; line-height: 1.3; }
    .hero-meta { display: flex; gap: 8px; font-size: 11px; color: #9ca3af; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .price-pill { color: #4ade80; font-weight: 700; background: rgba(34, 197, 94, 0.12); padding: 2px 6px; border-radius: 4px; }
    .size-pill { color: #38bdf8; font-weight: 600; background: rgba(56, 189, 248, 0.12); padding: 2px 6px; border-radius: 4px; }

    .control-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .select-input { flex: 1; min-height: 34px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15); padding: 0 10px; font-size: 11px; background: #1e222d; font-weight: 600; color: #fff; outline: none; }
    
    .stats-bar { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #9ca3af; font-weight: 600; margin-bottom: 8px; }
    .select-all-btn { background: none; border: none; color: #ec4899; font-size: 11px; font-weight: 700; cursor: pointer; text-decoration: underline; }

    /* Visual Grid */
    .batch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 250px; overflow-y: auto; padding: 6px; background: #161922; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; margin-bottom: 12px; }
    .grid-item { position: relative; aspect-ratio: 3/4; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: #222734; }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; }
    .grid-item.selected { border-color: #ec4899; box-shadow: 0 0 0 2px rgba(236, 72, 153, .4); }
    .grid-item .check { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 800; border: 1px solid #fff; }
    .grid-item.selected .check { background: #ec4899; }
    .grid-item .category-tag { position: absolute; bottom: 4px; left: 4px; right: 4px; background: rgba(0, 0, 0, 0.85); color: #fff; font-size: 8.5px; font-weight: 700; padding: 2px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }

    /* 4 Action Buttons */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .btn-main { grid-column: span 2; min-height: 40px; border: none; border-radius: 10px; background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); color: #fff; font-size: 12px; font-weight: 750; cursor: pointer; transition: all .16s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-main:hover { opacity: 0.9; }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-sub { min-height: 36px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; background: rgba(255, 255, 255, 0.08); color: #f3f4f6; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-sub:hover { background: rgba(255, 255, 255, 0.15); }

    .toast { display: none; padding: 10px; border-radius: 8px; background: rgba(34, 197, 94, 0.15); color: #4ade80; font-size: 11px; font-weight: 700; text-align: center; margin-top: 10px; border: 1px solid rgba(34, 197, 94, 0.3); }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-group">
      <span class="brand">shelf.</span>
      <span class="brand-sub">AI MULTI-MODAL CLIPPER</span>
    </div>
    <span class="badge">● Live Auto-Sync</span>
  </div>

  <div id="hero-details" class="product-hero-card" style="display: none;">
    <div id="hero-title" class="hero-title">MYALI Brasil Rio Graphic Slim Fit for women</div>
    <div class="hero-meta">
      <span id="hero-price" class="price-pill">₹245</span>
      <span id="hero-sizes" class="size-pill">Sizes: S, M, L, XL</span>
      <span id="hero-fabric" style="color: #cbd5e1;">Cotton</span>
    </div>
  </div>

  <div class="control-row">
    <select id="target-collection" class="select-input">
      <option value="meesho-genz-2026">Collection: Gen Z Streetwear &amp; Graphic Drops</option>
      <option value="brasilcore-edits">Collection: Brasilcore &amp; Y2K Baby Tees</option>
      <option value="co-ord-sets">Collection: Y2K Co-ord Sets &amp; Skirts</option>
      <option value="meesho-dresses-2026">Collection: Slinky Bodycon Dresses</option>
      <option value="meesho-kurtis-2026">Collection: Festive &amp; Ethnic Kurtis</option>
      <option value="winter-2026">Collection: Winter Cold-Girl Puffers</option>
    </select>
  </div>

  <div class="stats-bar">
    <span id="scan-count">Scanning product images...</span>
    <button id="toggle-select-all" class="select-all-btn">Select All</button>
  </div>

  <div id="batch-grid" class="batch-grid">
    <!-- Filtered Garment photos injected dynamically -->
  </div>

  <!-- 4 Action Controls -->
  <div class="action-grid">
    <button id="batch-publish-btn" class="btn-main" disabled>🚀 Ingest Selected (0 Items) to Storefront</button>
    <button id="export-csv-btn" class="btn-sub">📥 Export Clean CSV</button>
    <button id="copy-link-btn" class="btn-sub">🔗 Copy Creator Link</button>
  </div>

  <div id="toast" class="toast">✓ Successfully processed!</div>

  <script src="popup.js"></script>
</body>
</html>
