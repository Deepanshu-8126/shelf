<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>shelf. AI Fashion Clipper & Multi-Modal Brain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 440px; max-height: 590px; overflow-y: auto; padding: 16px; background: #fbf8f6; color: #292329; }
    
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand-group { display: flex; align-items: baseline; gap: 4px; }
    .brand { font-size: 17px; font-weight: 800; color: #813653; font-family: Georgia, serif; }
    .brand-sub { font-size: 9px; font-weight: 800; letter-spacing: .08em; color: #786f78; }
    .badge { font-size: 9px; font-weight: 750; background: #ecfdf5; color: #065f46; padding: 3px 8px; border-radius: 99px; border: 1px solid #a7f3d0; display: inline-flex; align-items: center; gap: 4px; }
    
    .ai-banner { background: #fff; border: 1px solid #ece4e7; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .ai-banner-title { font-size: 10.5px; font-weight: 750; color: #292329; }
    .ai-banner-desc { font-size: 9px; color: #786f78; }
    .ai-pill { font-size: 8.5px; font-weight: 800; background: #fdf2f8; color: #9d174d; border: 1px solid #fbcfe8; padding: 2px 6px; border-radius: 99px; }

    .control-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .select-input { flex: 1; min-height: 34px; border-radius: 8px; border: 1px solid #ece4e7; padding: 0 10px; font-size: 11px; background: #fff; font-weight: 600; color: #292329; outline: none; }
    
    .stats-bar { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: #786f78; font-weight: 600; margin-bottom: 8px; }
    .select-all-btn { background: none; border: none; color: #813653; font-size: 10.5px; font-weight: 750; cursor: pointer; text-decoration: underline; }

    /* Batch Visual Grid */
    .batch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 310px; overflow-y: auto; padding: 6px; background: #fff; border: 1px solid #ece4e7; border-radius: 12px; margin-bottom: 12px; }
    .grid-item { position: relative; aspect-ratio: 3/4; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: #f5f5f5; }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; }
    .grid-item.selected { border-color: #813653; box-shadow: 0 0 0 2px rgba(129, 54, 83, .25); }
    .grid-item .check { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 800; border: 1px solid #fff; }
    .grid-item.selected .check { background: #813653; }
    .grid-item .category-tag { position: absolute; bottom: 4px; left: 4px; right: 4px; background: rgba(41, 35, 41, 0.85); color: #fff; font-size: 8px; font-weight: 750; padding: 2px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn { width: 100%; min-height: 42px; border: none; border-radius: 10px; background: #813653; color: #fff; font-size: 12px; font-weight: 750; cursor: pointer; transition: all .16s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:hover { background: #5f243b; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .toast { display: none; padding: 10px; border-radius: 8px; background: #ecfdf5; color: #065f46; font-size: 11px; font-weight: 750; text-align: center; margin-top: 10px; border: 1px solid #a7f3d0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-group">
      <span class="brand">shelf.</span>
      <span class="brand-sub">AI MULTI-MODAL CLIPPER</span>
    </div>
    <span class="badge">● Live Auto-Sync</span>
  </div>

  <div class="ai-banner">
    <div>
      <div class="ai-banner-title">✨ Multi-Modal Fashion Intelligence</div>
      <div class="ai-banner-desc">Auto-tags category, profit markup &amp; SEO title</div>
    </div>
    <span class="ai-pill">ACTIVE</span>
  </div>

  <div class="control-row">
    <select id="target-collection" class="select-input">
      <option value="co-ord-sets">Collection: Y2K Co-ord Sets &amp; Skirt Outfits</option>
      <option value="blokecore-jerseys">Collection: Viral Blokecore &amp; Football Jerseys</option>
      <option value="pinterest-streetwear">Collection: Pinterest Racing &amp; Streetwear</option>
      <option value="brasilcore-edits">Collection: Brasilcore &amp; Y2K Baby Tees</option>
      <option value="meesho-dresses-2026">Collection: Slinky Party Dresses</option>
      <option value="meesho-kurtis-2026">Collection: Festive &amp; Garba Kurtis</option>
      <option value="winter-2026">Collection: Winter Cold-Girl &amp; Puffers</option>
    </select>
  </div>

  <div class="stats-bar">
    <span id="scan-count">Scanning page for items...</span>
    <button id="toggle-select-all" class="select-all-btn">Select All</button>
  </div>

  <div id="batch-grid" class="batch-grid">
    <!-- Scraped items injected dynamically -->
  </div>

  <button id="batch-publish-btn" class="btn" disabled>🚀 Ingest Selected (0 Items) to Page 1</button>
  <div id="toast" class="toast">✓ Successfully published to Storefront Page 1!</div>

  <script src="popup.js"></script>
</body>
</html>
