services:
  bot:
    build:
      context: ./factshorts-bot
      dockerfile: Dockerfile
    image: factshorts-bot:latest
    container_name: factshorts
    restart: unless-stopped
    env_file: ./factshorts-bot/.env
    volumes:
      - ./factshorts-bot/data:/app/data
      - ./factshorts-bot/cache:/app/cache
      - ./factshorts-bot/output:/app/output
      - ./factshorts-bot/logs:/app/logs
      - ./factshorts-bot/credentials:/app/credentials
      - ./factshorts-bot/assets/music:/app/assets/music
      - ./factshorts-bot/assets/stock:/app/assets/stock
    shm_size: "512m"
