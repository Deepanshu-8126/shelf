<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tactical Hook</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=JetBrains+Mono:wght@500;700;800&family=Cinzel:wght@700;900&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #06080d;
      font-family: 'JetBrains Mono', monospace;
      color: #ffffff;
    }
    #root {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #101626 0%, #06080d 80%);
    }

    /* CRT Scanlines Overlay */
    .scanlines {
      position: absolute; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 50;
      pointer-events: none;
      opacity: 0.7;
    }

    /* Tactical Recon Grid */
    .recon-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.07) 1px, transparent 1px);
      background-size: 80px 80px;
      background-position: center center;
    }

    /* Top Military Header */
    .telemetry-bar {
      position: absolute; top: 120px; left: 80px; right: 80px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px;
      background: rgba(0, 240, 255, 0.04);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-left: 4px solid #00f0ff;
      font-size: 20px;
      letter-spacing: 0.15em;
      color: #00f0ff;
      text-transform: uppercase;
    }
    .status-live {
      display: flex; align-items: center; gap: 10px;
      color: #ff3b30; font-weight: 700;
    }
    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 12px #ff3b30;
    }

    /* Center Satellite Radar Display */
    .radar-system {
      position: absolute; top: 760px; left: 50%;
      transform: translate(-50%, -50%);
      width: 720px; height: 720px;
    }
    .radar-ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .ring-outer { width: 700px; height: 700px; border-width: 2px; }
    .ring-mid { width: 500px; height: 500px; border-style: dashed; border-color: rgba(0, 240, 255, 0.3); }
    .ring-inner { width: 280px; height: 280px; border-color: rgba(255, 214, 10, 0.4); }
    
    .radar-crosshair-h {
      position: absolute; top: 50%; left: 0; right: 0; height: 1px;
      background: rgba(0, 240, 255, 0.25);
    }
    .radar-crosshair-v {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
      background: rgba(0, 240, 255, 0.25);
    }

    .radar-sweep {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0, 240, 255, 0.45) 0deg, transparent 65deg, transparent 360deg);
      transform-origin: center center;
    }

    .radar-target {
      position: absolute; top: 44%; left: 58%;
      width: 28px; height: 28px;
      border: 2px solid #ff3b30;
      border-radius: 50%;
      background: rgba(255, 59, 48, 0.4);
      box-shadow: 0 0 25px #ff3b30;
      transform: translate(-50%, -50%);
    }
    .target-ping {
      position: absolute; top: 50%; left: 50%;
      width: 100%; height: 100%;
      border: 2px solid #ff3b30;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .target-label {
      position: absolute; left: 40px; top: -12px;
      font-size: 18px; color: #ff3b30; font-weight: 700;
      letter-spacing: 0.1em;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(255, 59, 48, 0.8);
    }

    /* Classified Red Rubber Stamp */
    .classified-stamp {
      position: absolute; top: 400px; left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      border: 8px solid #ff3b30;
      border-radius: 12px;
      padding: 16px 40px;
      color: #ff3b30;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      box-shadow: inset 0 0 25px rgba(255, 59, 48, 0.3), 0 0 35px rgba(255, 59, 48, 0.5);
      z-index: 40;
      opacity: 0;
    }

    /* Kinetic Subtitles (Safe Area: Bottom 350px) */
    .caption-container {
      position: absolute; bottom: 320px; left: 60px; right: 60px;
      text-align: center;
      z-index: 30;
    }
    .caption-eyebrow {
      font-size: 26px;
      letter-spacing: 0.2em;
      color: #00f0ff;
      margin-bottom: 20px;
      text-transform: uppercase;
      opacity: 0;
    }
    .caption-headline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 72px;
      line-height: 1.15;
      font-weight: 800;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 4px 30px rgba(0,0,0,0.9);
    }
    .caption-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(30px) scale(0.85);
      margin: 0 8px;
    }
    .caption-word.highlight {
      color: #ffd60a;
      text-shadow: 0 0 35px rgba(255, 214, 10, 0.8), 0 0 70px rgba(255, 214, 10, 0.4);
    }

    /* Footer Telemetry Coordinates */
    .coord-footer {
      position: absolute; bottom: 120px; left: 80px; right: 80px;
      display: flex; justify-content: space-between;
      color: rgba(255, 255, 255, 0.4);
      font-size: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="4.0" data-width="1080" data-height="1920">
    <div class="scanlines"></div>
    <div class="recon-grid"></div>

    <!-- Header Telemetry -->
    <div class="telemetry-bar">
      <div>SATELLITE RECON // KH-11 KENNAN</div>
      <div class="status-live">
        <div class="status-dot"></div>
        LIVE FEED
      </div>
    </div>

    <!-- Classified Stamp -->
    <div class="classified-stamp" id="stamp">TOP SECRET // EYES ONLY</div>

    <!-- Center Radar System -->
    <div class="radar-system">
      <div class="radar-ring ring-outer"></div>
      <div class="radar-ring ring-mid"></div>
      <div class="radar-ring ring-inner"></div>
      <div class="radar-crosshair-h"></div>
      <div class="radar-crosshair-v"></div>
      <div class="radar-sweep" id="radarSweep"></div>

      <!-- Target Lock -->
      <div class="radar-target" id="radarTarget">
        <div class="target-ping" id="targetPing"></div>
        <div class="target-label">ANOMALY [RICHAT 21.12°N]</div>
      </div>
    </div>

    <!-- Kinetic Captions -->
    <div class="caption-container">
      <div class="caption-eyebrow" id="eyebrow">SECTOR 7 DECLASSIFIED DOSSIER</div>
      <div class="caption-headline">
        <span class="caption-word" id="w1">SOMETHING</span>
        <span class="caption-word" id="w2">IMPOSSIBLE</span>
        <br>
        <span class="caption-word" id="w3">WAS</span>
        <span class="caption-word highlight" id="w4">FOUND</span>
        <span class="caption-word highlight" id="w5">HERE.</span>
      </div>
    </div>

    <!-- Footer Coordinates -->
    <div class="coord-footer">
      <div>LAT: 21° 07' 29" N</div>
      <div>ELEVATION: -140M SUB-SURFACE</div>
      <div>LON: 11° 24' 11" W</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. Radar continuous sweep over 4 seconds
    tl.to("#radarSweep", {
      rotation: 720,
      duration: 4.0,
      ease: "none"
    }, 0);

    // 2. Target pulse & ping expansion
    tl.fromTo("#targetPing", 
      { scale: 1, opacity: 1 }, 
      { scale: 3.5, opacity: 0, duration: 1.2, repeat: 2, ease: "power2.out" }, 
      0.3
    );

    // 3. Classified Stamp Impact (0.6s) with Slam & Camera Shake
    tl.fromTo("#stamp", 
      { scale: 3.5, opacity: 0, rotation: -25 }, 
      { scale: 1, opacity: 1, rotation: -12, duration: 0.35, ease: "power4.in" }, 
      0.6
    );
    // Camera shake impact
    tl.to("#root", { x: -14, y: 10, duration: 0.05, ease: "power1.inOut" }, 0.95);
    tl.to("#root", { x: 12, y: -8, duration: 0.05, ease: "power1.inOut" }, 1.0);
    tl.to("#root", { x: -6, y: 4, duration: 0.05, ease: "power1.inOut" }, 1.05);
    tl.to("#root", { x: 0, y: 0, duration: 0.05, ease: "power1.inOut" }, 1.1);

    // 4. Eyebrow fade in (1.1s)
    tl.to("#eyebrow", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.1);

    // 5. Kinetic Word-by-Word Subtitles (Pop with elastic spring)
    tl.to("#w1", { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2.0)" }, 1.3);
    tl.to("#w2", { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2.0)" }, 1.7);
    tl.to("#w3", { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 2.2);
    tl.to("#w4", { opacity: 1, y: 0, scale: 1.15, duration: 0.4, ease: "back.out(2.5)" }, 2.6);
    tl.to("#w5", { opacity: 1, y: 0, scale: 1.15, duration: 0.4, ease: "back.out(2.5)" }, 2.9);

    // 6. Camera slow push-in over the entire 4 seconds (Z-axis scale)
    tl.fromTo(".radar-system", 
      { scale: 0.95 }, 
      { scale: 1.12, duration: 4.0, ease: "sine.out" }, 
      0
    );

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
