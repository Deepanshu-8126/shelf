services:
  bot:
    build: .
    image: factshorts-bot:latest
    container_name: factshorts
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data            # sqlite db (topics, queue, stats)
      - ./cache:/app/cache          # downloaded clips + temp renders
      - ./output:/app/output        # finished mp4s
      - ./logs:/app/logs
      - ./credentials:/app/credentials   # client_secret.json + token.json
      - ./assets/music:/app/assets/music # your royalty-free music
      - ./assets/stock:/app/assets/stock # your own clips (optional)
    # ffmpeg loves CPU: give it enough
    shm_size: "512m"
